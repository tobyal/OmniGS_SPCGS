<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRIS · 全景语义审核</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div><small>SPC-GS / DATA WORKSPACE</small><h1>IRIS 全景语义审核</h1></div><div class="headerActions"><span id="summary"></span><select id="exportScope"><option value="approved">仅导出已人工通过</option><option value="candidates">导出全部候选（含未审核）</option></select><button id="export">导出标签包 ↗</button></div></header>
<section id="overview"><div class="intro"><h2>训练集 · 56 个视角</h2><p>官方标注与 SAM2 补全共用原始全景坐标。未知区域保持 ignore；自动候选均需人工确认。</p></div><div class="filters"><input id="search" placeholder="搜索时间或序号" aria-label="搜索图像"><select id="classFilter"><option value="">全部类别</option></select><select id="sourceFilter"><option value="">全部来源</option><option value="official">含官方标注</option><option value="new">无官方标注</option><option value="sam">含 SAM2 补全</option><option value="human">含人工编辑</option></select><select id="reviewFilter"><option value="">全部状态</option><option value="unprocessed">未处理</option><option value="candidate">自动候选 · 待审核</option><option value="issues">存在问题 · 待修正</option><option value="approved">已人工通过</option></select><span id="count"></span></div><div id="grid"></div></section>
<section id="editor" hidden><nav><button id="back">← 全部图像</button><button id="prev">上一张</button><button id="next">下一张</button><strong id="imageTitle"></strong><span id="status"></span></nav>
<div class="workspace"><main><div class="toolbar"><select id="layer"><option value="current">当前叠加</option><option value="rgb">原始 RGB</option><option value="labels">彩色标签</option><option value="official">官方映射叠加</option><option value="raw">官方原始 16 类</option><option value="diff">新增 / 修改区域</option></select><label>透明度 <input type="range" id="opacity" min="0" max="100" value="48"></label><button id="zoomOut">−</button><button id="fit">适应窗口</button><button id="zoomIn">＋</button><select id="face"><option value="">局部透视</option><option value="front">前</option><option value="right">右</option><option value="back">后</option><option value="left">左</option><option value="up">上</option><option value="down">下</option></select></div>
<div id="viewport"><canvas id="canvas" width="2048" height="1024"></canvas></div><div class="hint"><span id="coords">ERP 2048 × 1024 · 左右周期连续</span><span id="dirty">已保存</span></div><div class="compare"><figure><figcaption>官方映射（留空为未标注）</figcaption><canvas id="originalMini" width="1024" height="512"></canvas></figure><figure><figcaption>当前整理版</figcaption><canvas id="currentMini" width="1024" height="512"></canvas></figure></div></main>
<aside><h3>查看类别</h3><div id="legend"></div><h3>编辑当前标签</h3><select id="target" aria-label="目标类别"></select><div class="tools"><button data-tool="pan" class="active">平移</button><button data-tool="region">区域改类</button><button data-tool="brush">画笔</button><button data-tool="erase">擦除 ignore</button><button data-tool="polygon">多边形</button><button data-tool="sam">SAM2 点选</button></div><label>画笔半径 <input id="radius" type="range" min="2" max="80" value="12"></label><p class="hint">区域改类操作同一连通区域；多边形双击完成。SAM2：左键正点，右键负点，先生成预览再应用。</p><div class="row"><button id="samRun">生成 SAM2</button><button id="samApply" disabled>应用掩码</button><button id="clearPoints">清除提示</button></div><div class="row"><button id="undo">撤销</button><button id="redo">重做</button><button id="save" class="primary">保存修改</button></div>
<h3>审核记录</h3><input id="reviewer" placeholder="审核人姓名" aria-label="审核人姓名"><textarea id="note" placeholder="审核备注 / 待修正问题" aria-label="审核备注"></textarea><div class="row"><button id="issue">标记问题</button><button id="approve" class="primary">人工确认通过</button><button id="revoke">撤销通过</button></div><p class="hint">通过仅绑定当前已保存版本。继续编辑并保存会撤销通过状态。</p><details><summary>版本历史与恢复</summary><select id="history"></select><button id="restore">恢复所选版本</button></details><details open><summary>覆盖与待处理问题</summary><div id="coverage"></div><ul id="issues"></ul></details></aside></div></section>
<dialog id="perspective"><button id="closePerspective">关闭 ×</button><p>当前已保存标签的 100° 透视叠加；编辑在 ERP 主画布中进行。</p><img id="perspectiveImage" alt="局部透视图"></dialog><div id="toast" role="status"></div><script src="/static/app.js"></script></body></html>
